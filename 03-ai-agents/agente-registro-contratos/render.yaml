# Despliegue en Render (https://render.com): un solo servicio web que sirve el front construido
# y la API. El proyecto vive en una subcarpeta del portafolio: rootDir hace que build, start y el
# auto-deploy se limiten a ella.
#
# Pasos (README.md, sección "Despliegue"):
#   1. Render → New → Blueprint → conectar el repo portafolio-dev (rama main).
#   2. Render pide los valores marcados con `sync: false`: la API key va SOLO ahí, nunca al repo.
#   3. Al terminar el build, el link queda en https://<nombre>.onrender.com
#
# El plan free se duerme tras 15 min sin tráfico (el primer request tarda ~1 min) y su disco es
# efímero: out/ se reinicia en cada deploy o reinicio, lo cual está bien para una demo.
services:
  - type: web
    name: agente-registro-contratos
    runtime: node
    rootDir: 03-ai-agents/agente-registro-contratos
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # El link público usa el plan gratuito de Gemini (costo cero). El adaptador reintenta ante el
      # límite por minuto (429). Para usar Anthropic: LLM_PROVIDER=anthropic + ANTHROPIC_API_KEY.
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5
      - key: ANTHROPIC_API_KEY
        sync: false
      # Link público: cada visitante procesa su propio buzón sin consumírselo a los demás.
      - key: AGENT_SESIONES_AISLADAS
        value: "true"
      # Topes de gasto (ver .env.example).
      - key: AGENT_MAX_TOKENS_PER_SESSION
        value: "1000000"
      - key: AGENT_MAX_TOKENS_TOTAL
        value: "10000000"
      # Opcional: si se define, la API exige el header x-access-key.
      - key: ACCESS_KEY
        sync: false
