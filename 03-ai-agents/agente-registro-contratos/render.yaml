# Despliegue en Render (https://render.com) — un solo servicio web que sirve el front
# construido y la API. Requiere conectar el repo en el dashboard de Render. El proyecto vive en
# una subcarpeta del portafolio: rootDir hace que build, start y el auto-deploy se limiten a ella.
#
# Tras el primer deploy, define los secretos en el dashboard (Environment):
#   LLM_PROVIDER   = gemini              (o anthropic)
#   GEMINI_API_KEY = <tu clave>          (o ANTHROPIC_API_KEY)
# Opcionales: GEMINI_MODEL, ANTHROPIC_MODEL, AGENT_MAX_ITERATIONS,
#             AGENT_MAX_TOKENS_PER_SESSION, ACCESS_KEY.
services:
  - type: web
    name: agente-registro-contratos
    runtime: node
    rootDir: 03-ai-agents/agente-registro-contratos
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
